name: Android Release Build

# 触发条件：当你推送 v1.0.0 这样的 tag 时，自动开始打包
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release Android AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: false

      - name: 📦 Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: 🔎 Diagnose Android embedding inputs
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          echo "Tag ref: ${GITHUB_REF}"
          echo "---- android/app/src/main/AndroidManifest.xml ----"
          sed -n '1,140p' android/app/src/main/AndroidManifest.xml
          echo "---- Scan for deleted Android v1 embedding markers ----"
          if grep -R --line-number -E "io\\.flutter\\.app\\.FlutterActivity|io\\.flutter\\.app\\.FlutterApplication|PluginRegistry\\.Registrar|registerWith\\(" android app/src || true; then
            echo "Scan complete."
          fi

      # ==========================================
      # ⚠️【周末带病演习模式：签名模块已全部封印】⚠️
      # 等下周拿到密码后，再把这里的注释解开
      # ==========================================
      
      # - name: 🔐 Decode Keystore
      #   env:
      #     ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
      #   run: |
      #     echo $ENCODED_KEYSTORE | base64 -d > android/app/upload-keystore.jks

      # - name: 📝 Create key.properties
      #   run: |
      #     cat << EOF > android/key.properties
      #     storePassword=${{ secrets.KEY_STORE_PASSWORD }}
      #     keyPassword=${{ secrets.KEY_PASSWORD }}
      #     keyAlias=${{ secrets.KEY_ALIAS }}
      #     storeFile=upload-keystore.jks
      #     EOF

      # ==========================================
      # 🎯 演习目标：打一个无签名的测试包
      # ==========================================
      
      - name: 🏗️ Build Debug APK (Sick Drill)
        working-directory: frontend
        run: flutter build apk --debug -v

      - name: ⬆️ Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3