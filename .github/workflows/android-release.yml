name: Android Release Build

# 触发条件：当你推送 v1.0.0 这样的 tag 时，自动开始打包
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release Android AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: false

      - name: 📦 Install dependencies
        working-directory: frontend
        run: flutter pub get

      # ==========================================
      # ⚠️【周末带病演习模式：签名模块已全部封印】⚠️
      # 等下周拿到密码后，再把这里的注释解开
      # ==========================================
      
      # - name: 🔐 Decode Keystore
      #   env:
      #     ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
      #   run: |
      #     echo $ENCODED_KEYSTORE | base64 -d > android/app/upload-keystore.jks

      # - name: 📝 Create key.properties
      #   run: |
      #     cat << EOF > android/key.properties
      #     storePassword=${{ secrets.KEY_STORE_PASSWORD }}
      #     keyPassword=${{ secrets.KEY_PASSWORD }}
      #     keyAlias=${{ secrets.KEY_ALIAS }}
      #     storeFile=upload-keystore.jks
      #     EOF

      # ==========================================
      # 🎯 演习目标：打一个无签名的测试包
      # ==========================================
      
      - name: 🏗️ Build Debug APK (Sick Drill)
        working-directory: frontend
        run: |
          echo "=== 1. 物理粉碎所有旧代码与缓存 ==="
          rm -rf android/app/src/main/kotlin/*
          rm -rf android/app/src/main/java/*
          rm -rf android/app/src/debug/*
          rm -rf android/app/src/profile/*
          
          echo "=== 2. 重铸纯净血统的 MainActivity.kt ==="
          # 根据你的截图，精准复刻你的包名
          mkdir -p android/app/src/main/kotlin/one/dothings/enerquote/
          cat << 'EOF' > android/app/src/main/kotlin/one/dothings/enerquote/MainActivity.kt
          package one.dothings.enerquote

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF
          
          echo "=== 3. 强行注入带包名的纯净 AndroidManifest.xml ==="
          # 👇 这里补上了极其致命的 package 属性！
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="one.dothings.enerquote">
              <application android:name="${applicationName}">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@style/LaunchTheme">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          EOF
          
          echo "=== 4. 决战起爆！ ==="
          # 环境已达绝对纯净，开始编译！
          flutter build apk --debug -v

      - name: ⬆️ Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3