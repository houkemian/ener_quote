name: Android Release Build

# 触发条件：当你推送 v1.0.0 这样的 tag 时，自动开始打包
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release Android AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: false

      - name: 📦 Install dependencies
        working-directory: frontend
        run: flutter pub get

      # ==========================================
      # ⚠️【周末带病演习模式：签名模块已全部封印】⚠️
      # 等下周拿到密码后，再把这里的注释解开
      # ==========================================
      
      # - name: 🔐 Decode Keystore
      #   env:
      #     ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
      #   run: |
      #     echo $ENCODED_KEYSTORE | base64 -d > android/app/upload-keystore.jks

      # - name: 📝 Create key.properties
      #   run: |
      #     cat << EOF > android/key.properties
      #     storePassword=${{ secrets.KEY_STORE_PASSWORD }}
      #     keyPassword=${{ secrets.KEY_PASSWORD }}
      #     keyAlias=${{ secrets.KEY_ALIAS }}
      #     storeFile=upload-keystore.jks
      #     EOF

      # ==========================================
      # 🎯 演习目标：打一个无签名的测试包
      # ==========================================
      
      - name: 🏗️ Build Debug APK (Sick Drill)
        working-directory: frontend
        run: |
          echo "=== 1. 物理拔除所有可能导致幻觉的隐藏缓存 ==="
          # 这极其关键！彻底烧毁所有欺骗编译器的前朝遗物！
          rm -rf .dart_tool/
          rm -rf .flutter-plugins
          rm -rf .flutter-plugins-dependencies
          rm -rf build/
          rm -rf android/.gradle/
          
          echo "=== 2. 物理毁灭自动生成的 V1 毒药文件 ==="
          # 防止刚才的缓存已经生成了毒药，我们再补一刀
          rm -rf android/app/src/main/java/io/flutter/plugins/
          
          echo "=== 3. 强行注入绝对纯净的 V2 Manifest ==="
          # 确保这道护身符绝对安全，注意里面的 package 必须和你真实包名一致
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="one.dothings.enerquote">
              <application android:name="${applicationName}" android:icon="@mipmap/ic_launcher" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@style/LaunchTheme" android:launchMode="singleTop">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          EOF
          
          echo "=== 4. 重新拉取纯净依赖 ==="
          # 在没有缓存污染的情况下，重新拉取
          flutter pub get
          
          echo "=== 5. 最终起爆！ ==="
          flutter build apk --debug -v

      - name: ⬆️ Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3