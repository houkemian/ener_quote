name: Android Release Build

# 触发条件：当你推送 v1.0.0 这样的 tag 时，自动开始打包
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release Android AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: false

      - name: 📦 Install dependencies
        working-directory: frontend
        run: flutter pub get

      # ==========================================
      # ⚠️【周末带病演习模式：签名模块已全部封印】⚠️
      # 等下周拿到密码后，再把这里的注释解开
      # ==========================================
      
      # - name: 🔐 Decode Keystore
      #   env:
      #     ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
      #   run: |
      #     echo $ENCODED_KEYSTORE | base64 -d > android/app/upload-keystore.jks

      # - name: 📝 Create key.properties
      #   run: |
      #     cat << EOF > android/key.properties
      #     storePassword=${{ secrets.KEY_STORE_PASSWORD }}
      #     keyPassword=${{ secrets.KEY_PASSWORD }}
      #     keyAlias=${{ secrets.KEY_ALIAS }}
      #     storeFile=upload-keystore.jks
      #     EOF

      # ==========================================
      # 🎯 演习目标：打一个无签名的测试包
      # ==========================================
      
      - name: 🏗️ Build Debug APK (Sick Drill)
        working-directory: frontend
        run: |
          echo "=== 1. 猎杀隐藏的 V1 残党源码 ==="
          # 寻找并直接抹杀任何残留旧版 io.flutter.app 导入的 Java/Kotlin 文件
          grep -rl "io.flutter.app" android/app/src/ | xargs -I {} rm -f {} || true
          
          echo "=== 2. 强行注入绝对纯净的 V2 Manifest ==="
          # 使用 EOF 原地生成文件，彻底断绝 Git 残留的隐形乱码或 BOM 幽灵
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:name="${applicationName}">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@style/LaunchTheme">
                      <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          EOF
          
          echo "=== 3. 终极决战编译 ==="
          # 就在这一刻，在被绝对净化的环境下发起编译！
          flutter build apk --debug -v

      - name: ⬆️ Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3